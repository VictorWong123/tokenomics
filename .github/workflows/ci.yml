name: portable-correctness
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        type: choice
        options: [portable, metal-research, model-metadata, trained-cpu, metal-ir, logit-fit, logit-live]
        default: portable
      metal_profiles:
        description: Apple correctness profiles (all or one candidate)
        type: choice
        options: [all, interleaved, q8-group, q8-shared]
        default: all
      trained_runner:
        description: Standard public runner for trained CPU correctness
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04
      trained_sampler:
        description: Target sampler candidate for trained CPU correctness
        type: choice
        options: [greedy, direct]
        default: greedy
      trained_model:
        description: Pinned public model for CPU correctness
        type: choice
        options: [qwen25-05, qwen25-15]
        default: qwen25-05
      logit_phase:
        description: Predeclared canonical-rank collection phase
        type: choice
        options: [fit, validation]
        default: fit
      metadata_model:
        description: Pinned public model header to inspect
        type: choice
        options: [qwen25-05, qwen25-15]
        default: qwen25-05
permissions:
  contents: read
jobs:
  cpu:
    if: inputs.scope == 'portable' || inputs.scope == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: bash scripts/bootstrap.sh cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check bench analysis scripts tests
      - run: clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp
      - run: .venv/bin/python scripts/run_all.py --backend cpu --fixtures-only --run-dir results/local/ci
  macos:
    if: inputs.scope == 'portable' || inputs.scope == ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: bash scripts/bootstrap.sh metal
      - run: .venv/bin/python scripts/run_all.py --backend metal --fixtures-only --run-dir results/local/ci-metal
  metal-research:
    if: >-
      inputs.scope == 'metal-research' &&
      github.ref == 'refs/heads/research/speculative-throughput-20261116' &&
      !github.event.repository.private
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile profiles and check device availability
        run: .venv/bin/python scripts/hosted_metal_preflight.py --profiles "${{ inputs.metal_profiles || 'all' }}" --out results/local/hosted-metal
      - name: Retain explicit diagnostic files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-metal-preflight
          path: |
            results/local/hosted-metal/*.json
            results/local/hosted-metal/*.log
          if-no-files-found: warn
          retention-days: 7
  model-metadata:
    if: >-
      inputs.scope == 'model-metadata' &&
      github.ref == 'refs/heads/research/speculative-throughput-20261116' &&
      !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect pinned public GGUF header
        env:
          TOKENOMICS_METADATA_MODEL: ${{ inputs.metadata_model || 'qwen25-05' }}
        run: python3 scripts/inspect_gguf_header.py --model "$TOKENOMICS_METADATA_MODEL" --out results/local/model-header/header.json
      - name: Retain header metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-model-header
          path: results/local/model-header/*.json
          if-no-files-found: warn
          retention-days: 7
  trained-cpu:
    if: >-
      inputs.scope == 'trained-cpu' &&
      github.ref == 'refs/heads/research/speculative-throughput-20261116' &&
      !github.event.repository.private
    runs-on: ${{ inputs.trained_runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      TOKENOMICS_TRAINED_SAMPLER: ${{ inputs.trained_sampler || 'greedy' }}
      TOKENOMICS_TRAINED_MODEL: ${{ inputs.trained_model || 'qwen25-05' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build guarded reference and sampler candidate
        run: |
          mkdir -p results/local/trained-cpu/binaries
          .venv/bin/cmake -S . -B build-hosted-trained -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$PWD/.venv/bin/ninja" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" -DBUILD_TESTING=ON \
            -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_CUDA=OFF \
            -DTOKENOMICS_CPU_BATCH_INVARIANT=ON -DTOKENOMICS_CPU_PACKED_VERIFY=OFF \
            -DTOKENOMICS_CPU_Q4_PAIR=OFF -DTOKENOMICS_GREEDY_NO_TEMP=OFF -DTOKENOMICS_GREEDY_DIRECT=OFF \
            -DTOKENOMICS_VERIFY_STAGE_TIMING=OFF -DTOKENOMICS_METAL_SHORT_MV=OFF \
            -DTOKENOMICS_METAL_INTERLEAVE=OFF -DTOKENOMICS_METAL_Q8_GROUP=OFF -DTOKENOMICS_METAL_Q8_SHARED=OFF
          .venv/bin/cmake --build build-hosted-trained --target tokenomics -j 2
          cp build-hosted-trained/tokenomics results/local/trained-cpu/binaries/guarded
          .venv/bin/python -c 'from bench.common import atomic_json; from scripts.diagnose_models import build_configuration; atomic_json("results/local/trained-cpu/compilation-reference.json", build_configuration("build-hosted-trained/tokenomics"))'
          TOKENOMICS_DIRECT=OFF
          if [ "$TOKENOMICS_TRAINED_SAMPLER" = direct ]; then TOKENOMICS_DIRECT=ON; fi
          .venv/bin/cmake -S . -B build-hosted-trained -DTOKENOMICS_GREEDY_NO_TEMP=ON -DTOKENOMICS_GREEDY_DIRECT="$TOKENOMICS_DIRECT"
          .venv/bin/cmake --build build-hosted-trained --target tokenomics test_greedy_equivalence -j 2
          cp build-hosted-trained/tokenomics results/local/trained-cpu/binaries/greedy
          .venv/bin/python -c 'from bench.common import atomic_json; from scripts.diagnose_models import build_configuration; atomic_json("results/local/trained-cpu/compilation-greedy.json", build_configuration("build-hosted-trained/tokenomics"))'
          build-hosted-trained/test_greedy_equivalence > results/local/trained-cpu/sampler-equivalence.log
          build-hosted-trained/test_greedy_equivalence --bench | tee results/local/trained-cpu/sampler-component.jsonl
          build-hosted-trained/test_greedy_equivalence --bench-direct | tee results/local/trained-cpu/direct-component.jsonl
          if [ "$TOKENOMICS_DIRECT" = ON ]; then
            .venv/bin/cmake --build build-hosted-trained --target test_greedy_direct_integration -j 2
            .venv/bin/ctest --test-dir build-hosted-trained --output-on-failure -R '^(fixtures|greedy_direct_integration)$'
          fi
          uname -sm | tee results/local/trained-cpu/architecture.log
      - name: Verify smoke orchestration on synthetic fixtures
        env:
          TOKENOMICS_TEST_BINARY: ${{ github.workspace }}/results/local/trained-cpu/binaries/guarded
          TOKENOMICS_TEST_CANDIDATE_PROFILE: ${{ inputs.trained_sampler || 'greedy' }}
          TOKENOMICS_GREEDY_BINARY: ${{ github.workspace }}/results/local/trained-cpu/binaries/greedy
        run: .venv/bin/python -m unittest discover -s tests -p test_trained_cpu_smoke.py
      - name: Download and verify pinned public model
        run: .venv/bin/python scripts/download_models.py --model "$TOKENOMICS_TRAINED_MODEL" --lock configs/metal-model-header-pins-v1.json --directory models
      - name: Compare trained CPU outputs and logical work
        run: |
          TOKENOMICS_MODEL_PATH="$(.venv/bin/python -c 'import json,os; from pathlib import Path; pins=json.loads(Path("configs/metal-model-header-pins-v1.json").read_text())["models"]; print("models/"+pins[os.environ["TOKENOMICS_TRAINED_MODEL"]]["file"])')"
          .venv/bin/python scripts/trained_cpu_smoke.py \
            --reference results/local/trained-cpu/binaries/guarded \
            --candidate results/local/trained-cpu/binaries/greedy \
            --model "$TOKENOMICS_MODEL_PATH" --model-id "$TOKENOMICS_TRAINED_MODEL" \
            --candidate-profile "$TOKENOMICS_TRAINED_SAMPLER" \
            --out results/local/trained-cpu/smoke
      - name: Retain correctness payload without weights or executables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trained-cpu-smoke
          path: |
            results/local/trained-cpu/compilation-*.json
            results/local/trained-cpu/*.log
            results/local/trained-cpu/sampler-component.jsonl
            results/local/trained-cpu/direct-component.jsonl
            results/local/trained-cpu/smoke/*.json
            results/local/trained-cpu/smoke/*.jsonl
            results/local/trained-cpu/smoke/*.log
          if-no-files-found: warn
          retention-days: 7
  metal-ir:
    if: >-
      inputs.scope == 'metal-ir' &&
      github.ref == 'refs/heads/research/speculative-throughput-20261116' &&
      !github.event.repository.private
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned source generator
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check cmake==3.31.6
      - name: Probe newer standard runner device
        run: .venv/bin/python scripts/hosted_metal_preflight.py --probe-only --out results/local/metal-ir/device
      - name: Generate exact owned shader source
        run: .venv/bin/cmake -S tests/metal-source -B build-metal-ir-source -DTOKENOMICS_SOURCE_Q8_SHARED_PROTOTYPE=ON
      - name: Check source-derived Q8 partial sums on Apple ARM CPU
        run: |
          .venv/bin/cmake -S tests/metal-q8-arithmetic -B build-metal-q8-arithmetic -DCMAKE_BUILD_TYPE=Release
          .venv/bin/cmake --build build-metal-q8-arithmetic --parallel 2
          .venv/bin/ctest --test-dir build-metal-q8-arithmetic -V | tee results/local/metal-ir/q8-host-partials.log
      - name: Emit compiler IR without executing GPU work
        run: |
          xcrun -sdk macosx metal -std=metal3.1 -DGGML_METAL_EMBED_LIBRARY -O3 \
            -S -emit-llvm build-metal-ir-source/tokenomics-metal-embed-mul_mv.metal \
            -o results/local/metal-ir/mul_mv.ll
          xcrun -sdk macosx metal -std=metal3.1 -DGGML_METAL_EMBED_LIBRARY -O3 \
            -S -emit-llvm build-metal-ir-source/tokenomics-metal-reference-mul_mv.metal \
            -o results/local/metal-ir/reference.ll
      - name: Compare textual IR with coordinate permutation
        run: |
          .venv/bin/python scripts/compare_metal_ir.py \
            --ir results/local/metal-ir/mul_mv.ll \
            --source build-metal-ir-source/tokenomics-metal-embed-mul_mv.metal \
            --reference-ir results/local/metal-ir/reference.ll \
            --reference-source build-metal-ir-source/tokenomics-metal-reference-mul_mv.metal \
            --out results/local/metal-ir/comparison.json
      - name: Retain compiler diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metal-ir-diagnostic
          path: |
            results/local/metal-ir/*.json
            results/local/metal-ir/*.log
            results/local/metal-ir/*.ll
            results/local/metal-ir/device/*.json
            results/local/metal-ir/device/*.log
          if-no-files-found: warn
          retention-days: 7

  logit-fit:
    if: >-
      (inputs.scope == 'logit-fit' || inputs.scope == 'logit-live') &&
      github.ref == 'refs/heads/research/speculative-throughput-20261116' &&
      !github.event.repository.private
    runs-on: ${{ inputs.scope == 'logit-live' && inputs.trained_runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.scope == 'logit-live' && 45 || 25 }}
    env:
      TOKENOMICS_LOGIT_COPY: ${{ inputs.scope == 'logit-live' && 'ON' || 'OFF' }}
      TOKENOMICS_LOGIT_PHASE: ${{ inputs.scope == 'logit-live' && 'validation' || inputs.logit_phase || 'fit' }}
      TOKENOMICS_FIT_MODEL: ${{ inputs.trained_model || 'qwen25-05' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile original guarded CPU ranking diagnostic
        run: |
          .venv/bin/cmake -S . -B build-logit-fit -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$PWD/.venv/bin/ninja" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" -DBUILD_TESTING=ON \
            -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_CUDA=OFF \
            -DTOKENOMICS_CPU_BATCH_INVARIANT=ON -DTOKENOMICS_CPU_PACKED_VERIFY=OFF \
            -DTOKENOMICS_CPU_Q4_PAIR=OFF -DTOKENOMICS_GREEDY_NO_TEMP=OFF -DTOKENOMICS_GREEDY_DIRECT=OFF \
            -DTOKENOMICS_VERIFY_STAGE_TIMING=OFF -DTOKENOMICS_LOGIT_COLLECTOR=ON \
            -DTOKENOMICS_LOGIT_COPY="$TOKENOMICS_LOGIT_COPY" \
            -DTOKENOMICS_METAL_SHORT_MV=OFF -DTOKENOMICS_METAL_INTERLEAVE=OFF \
            -DTOKENOMICS_METAL_Q8_GROUP=OFF -DTOKENOMICS_METAL_Q8_SHARED=OFF
          .venv/bin/cmake --build build-logit-fit --target collect_target_logits tokenomics test_logit_copy test_logit_copy_scalar -j 2
          build-logit-fit/test_logit_copy
          build-logit-fit/test_logit_copy_scalar
      - name: Check stable ranks and observer equivalence on a synthetic fixture
        env:
          TOKENOMICS_LOGIT_BINARY: ${{ github.workspace }}/build-logit-fit/collect_target_logits
        run: .venv/bin/python -m unittest discover -s tests -p test_logit_collection.py
      - name: Download and verify the selected pinned public model
        run: .venv/bin/python scripts/download_models.py --model "$TOKENOMICS_FIT_MODEL" --lock configs/metal-model-header-pins-v1.json --directory models
      - name: Collect only the predeclared development ranks
        run: |
          TOKENOMICS_MODEL_PATH="$(.venv/bin/python -c 'import json,os; from pathlib import Path; pins=json.loads(Path("configs/metal-model-header-pins-v1.json").read_text())["models"]; print("models/"+pins[os.environ["TOKENOMICS_FIT_MODEL"]]["file"])')"
          .venv/bin/python scripts/collect_logit_fit.py \
            --binary build-logit-fit/collect_target_logits --model "$TOKENOMICS_MODEL_PATH" \
            --model-id "$TOKENOMICS_FIT_MODEL" --phase "$TOKENOMICS_LOGIT_PHASE" --out results/local/logit-fit
      - name: Verify live guided decoding against canonical validation replay
        if: inputs.scope == 'logit-live'
        run: |
          TOKENOMICS_MODEL_PATH="$(.venv/bin/python -c 'import json,os; from pathlib import Path; pins=json.loads(Path("configs/metal-model-header-pins-v1.json").read_text())["models"]; print("models/"+pins[os.environ["TOKENOMICS_FIT_MODEL"]]["file"])')"
          .venv/bin/python scripts/check_logit_copy.py \
            --binary build-logit-fit/tokenomics --model "$TOKENOMICS_MODEL_PATH" \
            --collection results/local/logit-fit --out results/local/logit-fit/live
      - name: Retain explicit diagnostic data without weights or executables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-logit-fit
          path: |
            results/local/logit-fit/*.json
            results/local/logit-fit/*.jsonl
            results/local/logit-fit/*.log
            results/local/logit-fit/live/*.json
            results/local/logit-fit/live/*.jsonl
            results/local/logit-fit/live/*.log
            results/local/logit-fit/live/canonical-replay/*.json
            results/local/logit-fit/live/canonical-replay/*.gz
          if-no-files-found: warn
          retention-days: 7
