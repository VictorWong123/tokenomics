name: portable-correctness
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        type: choice
        options: [portable, metal-research, model-metadata, trained-cpu, metal-ir]
        default: portable
      metal_profiles:
        description: Apple profiles (use interleaved to check only the remaining prototype)
        type: choice
        options: [all, interleaved]
        default: all
permissions:
  contents: read
jobs:
  cpu:
    if: inputs.scope == 'portable' || inputs.scope == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: bash scripts/bootstrap.sh cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check bench analysis scripts tests
      - run: clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp
      - run: .venv/bin/python scripts/run_all.py --backend cpu --fixtures-only --run-dir results/local/ci
  macos:
    if: inputs.scope == 'portable' || inputs.scope == ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: bash scripts/bootstrap.sh metal
      - run: .venv/bin/python scripts/run_all.py --backend metal --fixtures-only --run-dir results/local/ci-metal
  metal-research:
    if: >-
      inputs.scope == 'metal-research' &&
      github.ref == 'refs/heads/research/speculative-throughput-20261116' &&
      !github.event.repository.private
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile profiles and check device availability
        run: .venv/bin/python scripts/hosted_metal_preflight.py --profiles "${{ inputs.metal_profiles || 'all' }}" --out results/local/hosted-metal
      - name: Retain explicit diagnostic files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-metal-preflight
          path: |
            results/local/hosted-metal/*.json
            results/local/hosted-metal/*.log
          if-no-files-found: warn
          retention-days: 7
  model-metadata:
    if: >-
      inputs.scope == 'model-metadata' &&
      github.ref == 'refs/heads/research/speculative-throughput-20261116' &&
      !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect pinned public GGUF header
        run: python3 scripts/inspect_gguf_header.py --out results/local/model-header/qwen05.json
      - name: Retain header metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-model-header
          path: results/local/model-header/*.json
          if-no-files-found: warn
          retention-days: 7
  trained-cpu:
    if: >-
      inputs.scope == 'trained-cpu' &&
      github.ref == 'refs/heads/research/speculative-throughput-20261116' &&
      !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build guarded reference and sampler candidate
        run: |
          mkdir -p results/local/trained-cpu/binaries
          .venv/bin/cmake -S . -B build-hosted-trained -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM="$PWD/.venv/bin/ninja" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" -DBUILD_TESTING=ON \
            -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_CUDA=OFF \
            -DTOKENOMICS_CPU_BATCH_INVARIANT=ON -DTOKENOMICS_CPU_PACKED_VERIFY=OFF \
            -DTOKENOMICS_CPU_Q4_PAIR=OFF -DTOKENOMICS_GREEDY_NO_TEMP=OFF \
            -DTOKENOMICS_VERIFY_STAGE_TIMING=OFF -DTOKENOMICS_METAL_SHORT_MV=OFF \
            -DTOKENOMICS_METAL_INTERLEAVE=OFF
          .venv/bin/cmake --build build-hosted-trained --target tokenomics -j 2
          cp build-hosted-trained/tokenomics results/local/trained-cpu/binaries/guarded
          .venv/bin/python -c 'from bench.common import atomic_json; from scripts.diagnose_models import build_configuration; atomic_json("results/local/trained-cpu/compilation-reference.json", build_configuration("build-hosted-trained/tokenomics"))'
          .venv/bin/cmake -S . -B build-hosted-trained -DTOKENOMICS_GREEDY_NO_TEMP=ON
          .venv/bin/cmake --build build-hosted-trained --target tokenomics test_greedy_equivalence -j 2
          cp build-hosted-trained/tokenomics results/local/trained-cpu/binaries/greedy
          .venv/bin/python -c 'from bench.common import atomic_json; from scripts.diagnose_models import build_configuration; atomic_json("results/local/trained-cpu/compilation-greedy.json", build_configuration("build-hosted-trained/tokenomics"))'
          build-hosted-trained/test_greedy_equivalence > results/local/trained-cpu/sampler-equivalence.log
      - name: Verify smoke orchestration on synthetic fixtures
        env:
          TOKENOMICS_TEST_BINARY: ${{ github.workspace }}/results/local/trained-cpu/binaries/guarded
          TOKENOMICS_GREEDY_BINARY: ${{ github.workspace }}/results/local/trained-cpu/binaries/greedy
        run: .venv/bin/python -m unittest discover -s tests -p test_trained_cpu_smoke.py
      - name: Download and verify pinned public model
        run: .venv/bin/python scripts/download_models.py --model qwen25-05 --lock configs/metal-model-header-pins-v1.json --directory models
      - name: Compare trained CPU outputs and logical work
        run: |
          .venv/bin/python scripts/trained_cpu_smoke.py \
            --reference results/local/trained-cpu/binaries/guarded \
            --candidate results/local/trained-cpu/binaries/greedy \
            --model models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            --out results/local/trained-cpu/smoke
      - name: Retain correctness payload without weights or executables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trained-cpu-smoke
          path: |
            results/local/trained-cpu/compilation-*.json
            results/local/trained-cpu/*.log
            results/local/trained-cpu/smoke/*.json
            results/local/trained-cpu/smoke/*.jsonl
            results/local/trained-cpu/smoke/*.log
          if-no-files-found: warn
          retention-days: 7
  metal-ir:
    if: >-
      inputs.scope == 'metal-ir' &&
      github.ref == 'refs/heads/research/speculative-throughput-20261116' &&
      !github.event.repository.private
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned source generator
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check cmake==3.31.6
      - name: Probe newer standard runner device
        run: .venv/bin/python scripts/hosted_metal_preflight.py --probe-only --out results/local/metal-ir/device
      - name: Generate exact owned shader source
        run: .venv/bin/cmake -S tests/metal-source -B build-metal-ir-source
      - name: Emit compiler IR without executing GPU work
        run: |
          xcrun -sdk macosx metal -std=metal3.1 -DGGML_METAL_EMBED_LIBRARY -O3 \
            -S -emit-llvm build-metal-ir-source/tokenomics-metal-embed-mul_mv.metal \
            -o results/local/metal-ir/mul_mv.ll
      - name: Compare textual IR with coordinate permutation
        run: |
          .venv/bin/python scripts/compare_metal_ir.py \
            --ir results/local/metal-ir/mul_mv.ll \
            --source build-metal-ir-source/tokenomics-metal-embed-mul_mv.metal \
            --out results/local/metal-ir/comparison.json
      - name: Retain compiler diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metal-ir-diagnostic
          path: |
            results/local/metal-ir/*.json
            results/local/metal-ir/*.ll
            results/local/metal-ir/device/*.json
            results/local/metal-ir/device/*.log
          if-no-files-found: warn
          retention-days: 7
