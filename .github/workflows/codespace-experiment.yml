name: Codespace development experiments
run-name: Tokenomics ${{ inputs.phase || (startsWith(github.ref, 'refs/tags/tokenomics-controller-packed-') && 'controller-packed' || 'profiles') }} | ${{ inputs.candidate || 'qwen25-05-3-q4' }} | ${{ inputs.drafter || 'ngram' }}

on:
  push:
    tags: [tokenomics-profiles-*, tokenomics-controller-packed-*]
  workflow_dispatch:
    inputs:
      phase:
        description: Fixed development experiment
        type: choice
        options: [timing, pilot, confirmation, kernel, controller, controller-packed, profiles]
        default: timing
      candidate:
        description: Fixed model candidate (all applies to full pilot)
        type: choice
        options: [all, qwen25-05-15-q4, qwen25-05-3-q4]
        default: all
      drafter:
        description: Fixed drafting mechanism
        type: choice
        options: [model, ngram]
        default: model

permissions:
  contents: read

concurrency:
  group: tokenomics-dedicated-codespace
  cancel-in-progress: false

jobs:
  initialize:
    if: github.repository == 'VictorWong123/tokenomics'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      claimed: ${{ steps.lifecycle.outputs.claimed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the frozen trained prerequisite before starting a tagged study
        if: github.event_name == 'push'
        env:
          TOKENOMICS_TAG_STUDY: ${{ startsWith(github.ref, 'refs/tags/tokenomics-controller-packed-') && 'controller-packed' || 'profiles' }}
        run: |
          python3 - <<'PY'
          import json, os
          from bench.common import ROOT
          from bench.cpu_profile import verified_packed_gate
          name = ('controller-packed-study-v1.json'
                  if os.environ['TOKENOMICS_TAG_STUDY'] == 'controller-packed'
                  else 'cpu-profile-screen-v1.json')
          cfg = json.loads((ROOT / 'configs' / name).read_text())
          verified_packed_gate(ROOT, cfg)
          print('Frozen trained prerequisite verified; tagged study may initialize.')
          PY
      - id: lifecycle
        name: Start dedicated runner with exact ownership
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          TOKENOMICS_CODESPACE: ${{ vars.TOKENOMICS_CODESPACE }}
          TOKENOMICS_RUNNER_NAME: ${{ vars.TOKENOMICS_RUNNER_NAME }}
          TOKENOMICS_RUNNER_ID: ${{ vars.TOKENOMICS_RUNNER_ID }}
        run: python3 scripts/codespaces/controller.py initialize

  workload:
    needs: initialize
    if: needs.initialize.outputs.claimed == 'true'
    runs-on: [self-hosted, linux, x64, tokenomics-codespace-long-tasks]
    timeout-minutes: 210
    outputs:
      summary: ${{ steps.fixtures.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - id: fixtures
        name: Run fixed resumable development experiment
        env:
          TOKENOMICS_RUNNER_NAME: ${{ vars.TOKENOMICS_RUNNER_NAME }}
          TOKENOMICS_RUNNER_ID: ${{ vars.TOKENOMICS_RUNNER_ID }}
          TOKENOMICS_EXPERIMENT_PHASE: ${{ inputs.phase || (startsWith(github.ref, 'refs/tags/tokenomics-controller-packed-') && 'controller-packed' || 'profiles') }}
          TOKENOMICS_EXPERIMENT_CANDIDATE: ${{ inputs.candidate || 'qwen25-05-3-q4' }}
          TOKENOMICS_EXPERIMENT_DRAFTER: ${{ inputs.drafter || 'ngram' }}
        run: /usr/bin/python3 scripts/experiment_workload.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tokenomics-development-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tokenomics-experiment-${{ github.run_id }}-${{ github.run_attempt }}/evidence.tar.gz
            ${{ runner.temp }}/tokenomics-experiment-${{ github.run_id }}-${{ github.run_attempt }}/report.json
          retention-days: 30
          if-no-files-found: error

  finalize:
    needs: [initialize, workload]
    if: ${{ always() && needs.initialize.outputs.claimed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shutdown_confirmed: ${{ steps.lifecycle.outputs.shutdown_confirmed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: lifecycle
        name: Verify ownership, stop runner and confirm actual Shutdown
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          TOKENOMICS_CODESPACE: ${{ vars.TOKENOMICS_CODESPACE }}
          TOKENOMICS_RUNNER_NAME: ${{ vars.TOKENOMICS_RUNNER_NAME }}
          TOKENOMICS_RUNNER_ID: ${{ vars.TOKENOMICS_RUNNER_ID }}
          WORKLOAD_SUMMARY: ${{ needs.workload.outputs.summary }}
        run: python3 scripts/codespaces/controller.py finalize
      - name: Retain hosted lifecycle result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tokenomics-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tokenomics-artifacts/report.json
          retention-days: 30
          if-no-files-found: warn

