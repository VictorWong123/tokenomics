name: Codespace fixtures

on:
  push:
    branches: [work, 'codex/**']

permissions:
  contents: read

concurrency:
  group: tokenomics-dedicated-codespace
  cancel-in-progress: false

jobs:
  fixtures:
    if: github.repository == 'VictorWong123/tokenomics'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run bounded Codespace controller
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          TOKENOMICS_CODESPACE: ${{ vars.TOKENOMICS_CODESPACE }}
        run: python3 scripts/codespaces/controller.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tokenomics-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tokenomics-controller/evidence.tar.gz
            ${{ runner.temp }}/tokenomics-controller/controller-report.json
            ${{ runner.temp }}/tokenomics-controller/controller.log
          retention-days: 3
          if-no-files-found: error
