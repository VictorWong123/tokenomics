name: Codespace fixtures

on:
  workflow_dispatch:
  push:
    branches: [work, 'codex/**']

permissions:
  contents: read

concurrency:
  group: codespace-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    if: github.repository == 'VictorWong123/tokenomics'
    runs-on: [self-hosted, linux, x64, tokenomics-codespace]
    timeout-minutes: 30
    env:
      TOKENOMICS_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Print execution evidence
        shell: bash
        run: |
          hostname
          uname -a
          pwd
          git rev-parse HEAD
      - name: Run CPU fixtures
        shell: bash
        run: bash run.sh cpu --fixtures-only --threads 2 --run-dir results/local/codespace-fixtures
